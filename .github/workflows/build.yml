name: Build wIT-Remote

# Baut den Client aus RustDesk (RUSTDESK_REF) mit den Patches und dem Branding
# aus diesem Repo: Windows x64 (exe + msi) und Android (arm64). Mit "publish"
# beim manuellen Start entsteht ein Release v{VERSION}-b{BUILD} mit signiertem
# update.json, das der Update-Server den Geräten anbietet.
#
# Repo-Variable:  SERVER_KEY          öffentlicher Schlüssel des ID-Servers
# Secrets:        UPDATE_SIGNING_KEY  ed25519-Seed für update.json (scripts/sign_release.py --keygen)
#                 ANDROID_SIGNING_KEY (Keystore als Base64), ANDROID_ALIAS,
#                 ANDROID_KEY_STORE_PASSWORD, ANDROID_KEY_PASSWORD
#
# Die Build-Schritte folgen .github/workflows/flutter-build.yml von RustDesk
# (gleiche Versionen von Rust, Flutter, LLVM, vcpkg, NDK).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Release veröffentlichen"
        type: boolean
        default: false

env:
  RUSTDESK_REF: "1.5.0"
  VERSION: "1.5.0"
  BUILD: ${{ github.run_number }}
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      app_name: ${{ steps.brand.outputs.app_name }}
      company: ${{ steps.brand.outputs.company }}
    steps:
      - uses: actions/checkout@v5

      - name: RustDesk-Quellcode holen
        run: git clone --depth 1 --branch "$RUSTDESK_REF" --recurse-submodules --shallow-submodules https://github.com/rustdesk/rustdesk.git rustdesk

      - name: Patches und Branding anwenden
        env:
          SERVER_KEY: ${{ vars.SERVER_KEY }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y librsvg2-bin
          pip3 install pillow
          python3 scripts/prepare.py rustdesk

      - id: brand
        run: |
          echo "app_name=$(jq -r .app_name brand/brand.json)" >> "$GITHUB_OUTPUT"
          echo "company=$(jq -r .company brand/brand.json)" >> "$GITHUB_OUTPUT"

      - name: Quellcode packen
        run: tar --exclude=.git -czf source.tar.gz rustdesk

      - uses: actions/upload-artifact@v6
        with:
          name: source
          path: source.tar.gz
          retention-days: 3

  bridge:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: source
      - run: tar -xzf source.tar.gz

      - name: Abhängigkeiten
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge
          workspaces: rustdesk

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Bridge erzeugen
        working-directory: rustdesk
        run: |
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --features uuid --locked
          # Wie in RustDesks bridge.yml: Flutter 3.22.3 braucht extended_text 13.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v6
        with:
          name: bridge
          retention-days: 3
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart

  topmost-window:
    # WindowInjection.dll für den Datenschutzmodus (third-party-RustDeskTempTopMostWindow.yml).
    runs-on: windows-2022
    steps:
      - uses: microsoft/setup-msbuild@v3
      - run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
      - uses: actions/upload-artifact@v6
        with:
          name: topmostwindow-x64
          path: RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll
          retention-days: 3

  windows:
    needs: [prepare, bridge, topmost-window]
    runs-on: windows-2022
    env:
      APP_NAME: ${{ needs.prepare.outputs.app_name }}
      COMPANY: ${{ needs.prepare.outputs.company }}
    steps:
      - name: GitHub-Actions-Cache für vcpkg freigeben
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/download-artifact@v7
        with:
          name: source
      - shell: bash
        run: tar -xzf source.tar.gz
      - uses: actions/download-artifact@v7
        with:
          name: bridge
          path: rustdesk

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Flutter-Engine von RustDesk einsetzen
        # https://github.com/flutter/flutter/issues/155685
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Flutter patchen
        shell: bash
        run: |
          cp rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows
          workspaces: rustdesk

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg-Abhängigkeiten
        working-directory: rustdesk
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      - name: Client bauen
        working-directory: rustdesk
        env:
          BRAND_BUILD: ${{ env.BUILD }}
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./dist
          # Der Dienst, taskkill und die Verknüpfungen erwarten <App-Name>.exe.
          mv ./dist/rustdesk.exe "./dist/$env:APP_NAME.exe"

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./dist

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./dist/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./dist/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./dist
            } else {
              Write-Output "Druckertreiber: Prüfsumme passt nicht, ohne Treiber weiter."
            }
          } catch {
            Write-Host "Druckertreiber übersprungen."
          }

      - name: Runner.res für den Installer
        working-directory: rustdesk
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; fi

      - uses: actions/download-artifact@v7
        with:
          name: topmostwindow-x64
          path: rustdesk/dist

      - name: Installer (exe)
        working-directory: rustdesk
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../dist/ -o . -e "../../dist/$APP_NAME.exe"
          popd
          mkdir -p ../out
          mv ./target/release/rustdesk-portable-packer.exe "../out/$APP_NAME-$VERSION-b$BUILD-x86_64.exe"

      - uses: microsoft/setup-msbuild@v3

      - name: Installer (msi)
        working-directory: rustdesk
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../dist --app-name "$env:APP_NAME" --manufacturer "$env:COMPANY" --revision-version $env:BUILD
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName "../../../out/$env:APP_NAME-$env:VERSION-b$env:BUILD-x86_64.msi"
          popd

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64
          path: out/*
          retention-days: 14

  android:
    needs: [prepare, bridge]
    runs-on: ubuntu-24.04
    env:
      APP_NAME: ${{ needs.prepare.outputs.app_name }}
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: GitHub-Actions-Cache für vcpkg freigeben
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libayatana-appindicator3-dev \
            libasound2-dev libc6-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev \
            libxfixes-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config wget

      - uses: actions/download-artifact@v7
        with:
          name: source
      - run: tar -xzf source.tar.gz
      - uses: actions/download-artifact@v7
        with:
          name: bridge
          path: rustdesk

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter patchen
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg-Abhängigkeiten
        working-directory: rustdesk
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android
          key: aarch64-linux-android
          workspaces: rustdesk

      - name: Bibliothek bauen
        working-directory: rustdesk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          BRAND_BUILD: ${{ env.BUILD }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          ./flutter/ndk_arm64.sh

      - name: App bauen
        working-directory: rustdesk
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Signiert wird danach mit dem eigenen Schlüssel.
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          (cd flutter && flutter build apk --release --target-platform android-arm64 --split-per-abi)
          mkdir -p ../apk
          mv flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../apk/$APP_NAME-$VERSION-b$BUILD-aarch64.apk"

      - name: APK signieren
        if: env.ANDROID_SIGNING_KEY != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
        run: |
          tools=/usr/local/lib/android/sdk/build-tools/$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "$ANDROID_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          apk="apk/$APP_NAME-$VERSION-b$BUILD-aarch64.apk"
          "$tools/zipalign" -f -p 4 "$apk" "$apk.aligned"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$apk.aligned"
          rm -f "$apk.aligned" "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" verify --print-certs "$apk" | head -3

      - uses: actions/upload-artifact@v6
        with:
          name: android-aarch64
          path: apk/${{ env.APP_NAME }}-*.apk
          retention-days: 14

  release:
    needs: [windows, android]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: windows-x86_64
          path: out
      - uses: actions/download-artifact@v7
        with:
          name: android-aarch64
          path: out

      - name: Update-Manifest signieren
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          pip3 install cryptography
          TAG="v$VERSION-b$BUILD"
          export UPDATE_PUBLIC_KEY=$(jq -r .update_public_key brand/brand.json)
          cd out
          python3 ../scripts/sign_release.py "$VERSION" "$BUILD" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG" *.msi *.exe *.apk
          ls -l

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION-b$BUILD"
          gh release create "$TAG" out/* --repo "${{ github.repository }}" \
            --title "$(jq -r .display_name brand/brand.json) $VERSION (Build $BUILD)" \
            --notes "RustDesk $RUSTDESK_REF mit den Patches aus diesem Repo. Quellcode: dieses Repo (AGPL-3.0)."
